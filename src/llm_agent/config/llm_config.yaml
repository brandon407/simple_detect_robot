llm_agent:
  ros__parameters:
    default_provider: "qwen"
    use_sim_time: true

    qwen:
      api_base: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      api_key: "${QWEN_API_KEY}"
      model: "qwen-plus"
      max_tokens: 4096

    ernie:
      api_base: "https://qianfan.baidubce.com/v2"
      api_key: "${ERNIE_API_KEY}"
      secret_key: "${ERNIE_SECRET_KEY}"
      model: "ernie-4.0-8k"

    deepseek:
      api_base: "https://api.deepseek.com/v1"
      api_key: "${DEEPSEEK_API_KEY}"
      model: "deepseek-chat"
      max_tokens: 4096

    knowledge_base:
      db_path: "~/.inspection_robot/knowledge"
      embedding_model: "text-embedding-v2"
      top_k_retrieval: 5

    report:
      output_dir: "/tmp/inspection_reports"
      format: "markdown"
      include_images: true
